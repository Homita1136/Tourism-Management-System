    <main class="feedback-section">

            <div class="feedback-heading">
                <h1>Share Your Feedback</h1>
                <p>We would love to hear about your experience with Explore India.</p>
            </div>

            <form name="feedbackForm" method="POST" action="feedback.php">

                <div class="form-group">
                    <label for="inputText">Your Name</label>
                    <input
                        type="text"
                        name="name"
                        class="form-control"

                </div>

                <div class="form-group">
                    <label for="inputEmail">Your Email</label>
                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        id="inputEmail"
                        placeholder="Enter your email"
                        required>
                </div>

                <div class="form-group text1">
                    <label for="feedbackText">Feedback</label>
                    <textarea
                        class="inputTextarea"
                        name="feedbk"
                        id="feedbackText"
                        rows="4"
                        placeholder="Please write your feedback here..."
                        required></textarea>
                </div>

                <div class="wrapper">
                    <button type="submit" class="btn btn-primary" name="submit">
                        Submit Feedback
                    </button>
                </div>

            </form>
        </div>
